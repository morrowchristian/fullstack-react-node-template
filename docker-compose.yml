version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sh", "-c", "cd /workspace/backend && npm install && npm start"]
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/hello"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sh", "-c", "cd /workspace/frontend && npm install && npm start"]
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development
      - WDS_SOCKET_PORT=0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge