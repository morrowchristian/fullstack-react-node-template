version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sh", "-c", "cd /workspace/backend && npm install && npm start"]
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sh", "-c", "cd /workspace/frontend && npm install && npm start"]
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://backend:5000
      - WDS_SOCKET_PORT=0  # Disable WebSocket for React dev server
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge